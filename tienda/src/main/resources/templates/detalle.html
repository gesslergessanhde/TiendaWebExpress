<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es"
      th:replace="~{layout :: html(titulo=${producto.nombre})}">
<body>
<div th:fragment="contenido">
    <section class="section detalle">
        <div class="detalle-img">
            <img th:src="@{'/img/' + ${producto.imagen}}" th:alt="${producto.nombre}"/>
        </div>
        <div class="detalle-info">
            <span class="tag" th:text="${producto.categoria}">cat</span>
            <h1 th:text="${producto.nombre}">Nombre</h1>
            <p class="price big" th:text="'$ ' + ${producto.precio}">$0</p>
            <p>
                <strong>Disponibilidad: </strong>
                <span th:text="${producto.disponible} ? 'En stock' : 'Agotado'"
                      th:classappend="${producto.disponible} ? 'ok' : 'no'"></span>
            </p>

            <button id="toggle-desc" class="btn">Ver descripcion</button>
            <p id="descripcion" class="descripcion oculto" th:text="${producto.descripcion}">desc</p>

            <div>
                <p> </p>
            </div>
            <div class="actions">
                <form th:action="@{'/carrito/agregar/' + ${producto.id}}" method="post" style="margin: 0; display: inline;">
                    <button type="submit" class="btn btn-primary btn-add" th:disabled="${!producto.disponible}">
                        Agregar al carrito
                    </button>
                </form>
                <a class="btn" th:href="@{'/pedido'(producto=${producto.nombre})}">Solicitar producto</a>
            </div>

            <p><a th:href="@{/catalogo}">&larr; Volver al catalogo</a></p>
        </div>
    </section>
</div>
</body>
</html>
