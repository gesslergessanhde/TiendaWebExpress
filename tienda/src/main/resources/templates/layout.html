<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${titulo} ?: 'Tienda Web Express'">Tienda Web Express</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body>
<header class="navbar">
    <a class="brand" th:href="@{/}">
        <span class="logo">TS</span>
        <span>TELESHACK</span>
    </a>
    <nav>
        <a th:href="@{/}">Inicio</a>
        <a th:href="@{/catalogo}">Catalogo</a>
        <a th:href="@{/pedido}">Pedido</a>
        <a th:href="@{/carrito}" class="cart-badge" style="text-decoration: none; color: inherit;">
            Carrito: <span id="cart-count" th:text="${totalCarrito}">0</span>
        </a>
    </nav>
</header>

<main th:insert="~{::contenido}">contenido</main>

<footer>
    <p>&copy; Grupo de Nelson, Halle y Gessler </p>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
